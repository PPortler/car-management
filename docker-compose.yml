services:
  postgres:
    image: postgres:16
    container_name: car-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: car_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    container_name: car-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/car_db?sslmode=disable",
        "up"
      ]

  backend:
    build: ./backend
    container_name: car-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_URL: postgres://postgres:postgres@postgres:5432/car_db?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: car-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres_data: